name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: make lint
      - name: Test
        run: make test
