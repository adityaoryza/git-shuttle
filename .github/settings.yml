repository:
  name: git-shuttle
  description: Git workflow assistant for predictable branch shipping and release preparation
  homepage: https://github.com/adityaoryza/git-shuttle
  private: false
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: true
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  delete_branch_on_merge: true
  default_branch: main

labels:
  - name: bug
    color: d73a4a
    description: Something isn't working
  - name: enhancement
    color: a2eeef
    description: New feature or request
  - name: documentation
    color: 0075ca
    description: Improvements or additions to documentation
  - name: question
    color: d876e3
    description: Further information is requested
  - name: good first issue
    color: 7057ff
    description: Good for newcomers
  - name: help wanted
    color: 008672
    description: Extra attention is needed

topics:
  - git
  - cli
  - developer-tools
  - workflow
  - release-management
  - branching
